stages:
  - stage: "deploy"
    displayName: "argocd deploy"
    condition: succeeded()
    dependsOn: "git_tag"
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
    - job: argo_cd
      displayName: "argocd deploy"
      variables:
      - template: /commons/variables.yml
      steps:
      - task: DownloadSecureFile@1
        name: private_key_file
        displayName: 'Download private key'
        inputs:
          secureFile: 'azure-devops-key-rsa-sha2-512'

      - bash: |
          RAW_ARCH=$(uname -m)
          
          # Convert common outputs to desired format
          case "$RAW_ARCH" in
              x86_64)
                  ARCH="amd64"
                  ;;
              aarch64)
                  ARCH="arm64"
                  ;;
              armv7l)
                  ARCH="armhf" # or "arm32" depending on your preference
                  ;;
              *)
                  # For other architectures, use the raw output or define specific mapping
                  ARCH="$RAW_ARCH"
                  ;;
          esac
          echo "The system architecture is: $ARCH"

          echo "Installing tools"
          sudo awk '{ gsub(/http:\/\/archive\.ubuntu\.com\/ubuntu\//, "http://br.archive.ubuntu.com/ubuntu/"); print }' /etc/apt/sources.list.d/ubuntu.sources > /tmp/ubuntu.sources && mv /tmp/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y curl git jq yq libicu74 rsync wget inetutils-ping  bind9-utils dnsutils gnupg ca-certificates lsb-release build-essential software-properties-common apt-transport-https golang-go          
          sudo curl -L -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-$ARCH && sudo chmod +x /usr/local/bin/argocd

          sudo apt-get install -y python3 python3-pip python3-venv python3-dev python3-pytest python3-requests python3-flake8 python3-mypy python3-bandit python3-flask

          sudo curl -o "/usr/bin/kubectl" -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/$ARCH/kubectl" && sudo chmod +x /usr/bin/kubectl
        displayName: install tools

      - template: /commons/extract_info.yml
        parameters:
          namespace_override: ${{ parameters.namespace_override }}
          archetype: ${{ parameters.archetype }}
          kustomization_overlay: ${{ parameters.kustomization_overlay }}

      - bash: |
          set -euo pipefail
          
          echo "Listando repositórios no ArgoCD..."
          
          if ! repos_json=$(argocd repo --grpc-web list \
            --server "$(ARGOCD_SERVER)" \
            --auth-token "$(ARGOCD_TOKEN)" \
            --insecure -o json 2>argocd_list_error.log); then
            echo "Erro ao listar repositórios no ArgoCD:"
            cat argocd_list_error.log
            exit 1
          fi
          
          repo_list=$(echo "$repos_json" | jq -r '.[].repo' | grep -x -- "$(repo_url)" || true)
          
          if [ -n "$repo_list" ]; then
            echo "O repositório $(repo_url) de $(app_name) já está cadastrado no Argo CD."
            echo "##vso[task.setvariable variable=repo_exists]true"
          else
            echo "O repositório $(repo_url) não está cadastrado no Argo CD."
            echo "Adicionando $(app_name)..."
            echo "##vso[task.setvariable variable=repo_exists]false"
          
            if ! argocd repo add "$(repo_url)" \
                  --ssh-private-key-path "$(private_key_file.secureFilePath)" \
                  --name "$(app_name)" \
                  --project "$(app_project)" \
                  --auth-token "$(ARGOCD_TOKEN)" \
                  --grpc-web --insecure \
                  --server "$(ARGOCD_SERVER)"; then
              echo "Erro ao adicionar repositório no ArgoCD."
              exit 1
            fi
          fi
        condition: succeeded()
        displayName: argocd check repository

      - bash: |
          proj_list=$(argocd proj list --auth-token $(ARGOCD_TOKEN) --grpc-web --insecure --server $(ARGOCD_SERVER) -o json | jq -r '.[] | .metadata.name' | grep $(app_project))

          if  [[ "$proj_list" == "$(app_project)" ]]; then
              echo "O projeto $(app_project) existe no Argo CD."
              echo "##vso[task.setvariable variable=app_exists]true"
          else
              echo "O aplicativo $(environment)-$(app_name) não existe no Argo CD."
              proj_list="none"
              echo "##vso[task.setvariable variable=app_exists]false"

              echo "Creating project $(app_project)"
              echo "
              argocd proj create $(app_project) \\
              -d $(CLUSTER_PROD),$(argocd_project_namespace) \\
              -s $(repo_url) \\
              --auth-token $(ARGOCD_TOKEN) \\
              --grpc-web \\
              --insecure \\
              --server $(ARGOCD_SERVER) \\
              --allow-namespaced-resource '*/*' \\
              --allow-cluster-resource '*/*' \\
              "
              argocd proj create $(app_project) \
              -d $(CLUSTER_PROD),$(argocd_project_namespace) \
              -s $(repo_url) \
              --auth-token $(ARGOCD_TOKEN) \
              --grpc-web \
              --insecure \
              --server $(ARGOCD_SERVER) \
              --allow-namespaced-resource '*/*' \
              --allow-cluster-resource '*/*'
          fi
          echo
          echo "DEBUG:"
          echo "proj_list: $proj_list"
        condition: succeeded()
        displayName: argocd check project

      - bash: |
          app_list=$(argocd app list --auth-token $(ARGOCD_TOKEN) --grpc-web --insecure --server $(ARGOCD_SERVER) -o json | jq -r '.[] | .metadata.name' | grep $(app_name)-$(environment))

          if  [[ "$app_list" == "$(app_name)-$(environment)" ]]; then
              echo "O aplicativo $(app_name)-$(environment) existe no Argo CD."
              echo "##vso[task.setvariable variable=app_exists]true"
          else
              echo "Aplicativo nao encontrado..."
              app_list="none"
              app_name="none"
              echo "##vso[task.setvariable variable=app_exists]false"
          fi

          echo
          echo "DEBUG app:"
          echo
          echo "app_list: $app_list"
          echo "app_name: $app_name"
        condition: succeeded()
        displayName: argocd check app

      - bash: |
          echo "Creating app $(app_name)"

          kustomization_path="./app/$(environment)"
          [[ ${{ parameters.kustomization_overlay }} == "true" ]] && kustomization_path="./app/$(environment)/overlays"

          echo "
          argocd app create $(app_name)-$(environment)  \\
            --repo $(repo_url) \\
            --path $kustomization_path \\
            --dest-server $(cluster_url) \\
            --dest-namespace $(namespace) \\
            --revision $(repo_tag) \\
            --project "$(app_project)" \\
            --sync-policy automated \\
            --sync-retry-limit 5 \\
            --sync-option CreateNamespace=true \\
            --sync-option Prune=true \\
            --insecure \\
            --grpc-web \\
            --server $(ARGOCD_SERVER) \\
            --auth-token $(ARGOCD_TOKEN) \\
            --set-finalizer \\
            --revision-history-limit 3
          "

          argocd app create $(app_name)-$(environment) \
              --repo $(repo_url) \
              --path $kustomization_path \
              --dest-server "$(cluster_url)" \
              --dest-namespace $(namespace) \
              --revision $(repo_tag) \
              --project "$(app_project)" \
              --sync-policy automated \
              --self-heal \
              --auto-prune \
              --sync-retry-limit 4 \
              --sync-option CreateNamespace=true \
              --insecure \
              --grpc-web \
              --server $(ARGOCD_SERVER) \
              --auth-token $(ARGOCD_TOKEN) \
              --set-finalizer \
              --revision-history-limit 3

        condition: and(succeeded(), eq(variables['app_exists'], 'false'))
        displayName: create argocd app

      - bash: |
          kustomization_path="./app/$(environment)"
          [[ ${{ parameters.kustomization_overlay }} == "true" ]] && kustomization_path="./app/$(environment)/overlays"

          echo "
          argocd app set "$(app_name)-$(environment)" \\
            --grpc-web --insecure \\
            --server $(ARGOCD_SERVER) \\
            --path $kustomization_path \\
            --dest-server "$(cluster_url)" \\
            --dest-namespace $(namespace) \\
            --revision $(repo_tag) \\
            --project "$(app_project)" \\
            --sync-policy automated \\
            --auto-prune \
            --self-heal \
            --sync-retry-limit 4 \\
            --auth-token "$(ARGOCD_TOKEN)"
          "

          argocd app set "$(app_name)-$(environment)" \
            --grpc-web --insecure \
            --server $(ARGOCD_SERVER) \
            --path $kustomization_path \
            --dest-server "$(cluster_url)" \
            --dest-namespace $(namespace) \
            --revision $(repo_tag) \
            --project "$(app_project)" \
            --sync-policy automated \
            --auto-prune \
            --self-heal \
            --sync-retry-limit 4 \
            --auth-token "$(ARGOCD_TOKEN)"

          echo "\
          argocd app sync $(app_name)-$(environment) \\
            --grpc-web \\
            --insecure \\
            --server $(ARGOCD_SERVER) \\
            --auth-token $(ARGOCD_TOKEN) \\
            --revision $repo_tag \\
            --project $(app_project) \\
            --prune \\
            --force \\
            --replace \\
            --timeout 200
          "


          argocd app sync "$(app_name)-$(environment)" \
            --grpc-web \
            --insecure \
            --server $(ARGOCD_SERVER) \
            --auth-token $(ARGOCD_TOKEN) \
            --revision $(repo_tag) \
            --project "$(app_project)" \
            --prune \
            --force \
            --replace \
            --timeout 200
        condition: succeeded()
        displayName: argocd app sync