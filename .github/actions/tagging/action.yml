name: "Git Tag"
description: "Create a git tag if missing"
inputs:
  repo_tag:
    description: "Tag to create"
    required: true
  tag_exists:
    description: "Whether tag already exists"
    required: true
  create_release:
    description: "Create GitHub release after tagging"
    required: false
    default: "false"
  environment:
    description: "Environment name (e.g., production)"
    required: false
    default: ""
  prerelease:
    description: "Whether GitHub release should be marked as prerelease"
    required: false
    default: "false"
  release_notes_file:
    description: "Optional path to release notes file"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Create tag if missing
      shell: bash
      env:
        REPO_TAG: ${{ inputs.repo_tag }}
        TAG_EXISTS: ${{ inputs.tag_exists }}
        CREATE_RELEASE: ${{ inputs.create_release }}
        ENVIRONMENT: ${{ inputs.environment }}
        PRERELEASE: ${{ inputs.prerelease }}
        RELEASE_NOTES_FILE: ${{ inputs.release_notes_file }}
        GITHUB_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
      run: $GITHUB_ACTION_PATH/../../../scripts/git_tag.sh
