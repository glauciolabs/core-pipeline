name: ci

description: 'Build and push docker containers'

on:
  push:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:

      - name: Extract build info
        id: info
        uses: glauciolabs/core-pipeline/.github/actions/extract-info@add2
        with:
          namespace_override: ${{ inputs.namespace_override || false }}
          kustomization_overlay: ${{ inputs.kustomization_overlay || false }}
          cluster_develop: ${{ secrets.CLUSTER_DEVELOP }}
          cluster_production: ${{ secrets.CLUSTER_PRODUCTION }}

      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          load: true
          tags: user/app:latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: user/app:latest
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.MYTOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: user/app:latest