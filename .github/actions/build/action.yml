name: "Build and Push Container"
description: "Build Docker image and push to selected registry"

inputs:
  container_registry:
    description: "Target registry: github or dockerhub"
    required: false
    default: "github"
  repo_tag:
    description: "Tag to push"
    required: true
  dockerhub_username:
    description: "DockerHub Username"
    required: false
  dockerhub_token:
    description: "DockerHub Token"
    required: false
  registry_username:
    description: "GitHub Registry Username"
    required: false
  registry_password:
    description: "GitHub Registry Password / Token"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: ${{ inputs.container_registry == 'dockerhub' }}
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Login to GitHub Container Registry (ghcr.io)
      if: ${{ inputs.container_registry == 'github' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Determine Registry Tag Prefix
      id: meta
      shell: bash
      run: |
        if [[ "${{ inputs.container_registry }}" == "dockerhub" ]]; then
          echo "image_name=${{ inputs.dockerhub_username }}/${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT
        else
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY}" >> $GITHUB_OUTPUT
        fi

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ steps.meta.outputs.image_name }}:${{ inputs.repo_tag }}
          ${{ steps.meta.outputs.image_name }}:latest