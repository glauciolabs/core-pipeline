name: Service CI

on:
  workflow_call:
    inputs:
      archetype:
        description: node-container or k8s-apps
        required: true
        type: string
      build_runner:
        description: Runner label for the image build (self-hosted runners need Snyk installed)
        type: string
        default: ubuntu-latest
      buildkit_driver_opts:
        description: Buildx driver options for the build runner
        type: string
        default: ""
      platforms:
        description: Comma-separated Linux platforms to build and scan
        type: string
        default: linux/amd64,linux/arm64
      kustomize_path:
        description: Kustomization directory for the k8s-apps archetype
        type: string
        default: "."
    secrets:
      SNYK_TOKEN:
        required: true
    outputs:
      image_ref:
        description: Scanned GHCR image reference including the immutable digest
        value: ${{ jobs.publish-image.outputs.image_ref }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Test and scan source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate archetype
        env:
          ARCHETYPE: ${{ inputs.archetype }}
        run: |
          case "$ARCHETYPE" in
            node-container|k8s-apps) ;;
            *) echo "::error::Expected archetype node-container or k8s-apps"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets with Gitleaks
        run: |
          docker run --rm --volume "$PWD:/src:ro" --workdir /src \
            --user "$(id -u):$(id -g)" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --log-opts=HEAD /src

      - name: Scan code with Semgrep
        run: |
          docker run --rm --volume "$PWD:/src:ro" --workdir /src \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            semgrep/semgrep:1.186.0 \
            semgrep scan --config p/default --metrics=off --error --strict

      - uses: actions/setup-node@v4
        if: inputs.archetype == 'node-container'
        with:
          node-version: "22"
          cache: npm

      - name: Build and test Node.js
        if: inputs.archetype == 'node-container'
        run: |
          npm ci
          npm run build
          npm test

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1309.0

      - name: Snyk Code
        if: inputs.archetype == 'node-container'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Snyk Open Source
        if: inputs.archetype == 'node-container'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --fail-on=all

      - name: Render and scan Kubernetes manifests
        if: inputs.archetype == 'k8s-apps'
        env:
          KUSTOMIZE_PATH: ${{ inputs.kustomize_path }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          manifest="$RUNNER_TEMP/kustomize-rendered.yaml"
          kustomize build -- "$KUSTOMIZE_PATH" > "$manifest"
          test -s "$manifest"
          snyk iac test "$manifest" --severity-threshold=high

  publish-image:
    name: Scan and publish immutable image
    needs: checks
    if: inputs.archetype == 'node-container' && github.event_name == 'push'
    runs-on: ${{ inputs.build_runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compute GHCR repository
        id: repository
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: ${{ inputs.buildkit_driver_opts }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        if: runner.environment == 'github-hosted'
        with:
          snyk-version: v1.1309.0

      - name: Build and push candidate by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ steps.repository.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Scan all platforms by digest with Snyk Container
        env:
          IMAGE: ${{ steps.repository.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::BuildKit did not return a valid image digest"
            exit 1
          fi
          if [[ ! "$PLATFORMS" =~ ^linux/[a-z0-9]+(/[a-z0-9]+)?(,linux/[a-z0-9]+(/[a-z0-9]+)?)*$ ]]; then
            echo "::error::Expected comma-separated Linux platforms"
            exit 1
          fi
          IFS=, read -r -a platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            snyk container test "$IMAGE@$DIGEST" --platform="$platform" \
              --file=Dockerfile --severity-threshold=high --fail-on=all
          done

      - name: Publish scanned digest
        id: publish
        env:
          IMAGE: ${{ steps.repository.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image_ref="$IMAGE@$DIGEST"
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:sha-$GITHUB_SHA" "$image_ref"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'Published `%s`\n' "$image_ref" >> "$GITHUB_STEP_SUMMARY"
