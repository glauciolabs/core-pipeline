name: Core Pipeline

on:
  workflow_dispatch:
    inputs:
      archetype:
        description: "Pipeline archetype"
        type: choice
        options:
          - containers
          - k8s-apps
        default: containers
      docker_options:
        description: "Docker build behavior"
        type: choice
        options:
          - build_and_push
          - build_only
          - disable_docker
        default: build_and_push
      namespace_override:
        description: "Use app namespace without environment suffix"
        type: boolean
        default: false
      kustomization_overlay:
        description: "Use overlays folder"
        type: boolean
        default: false
      helm_chart:
        description: "Use Helm chart (unused for now)"
        type: boolean
        default: false
      gitops_app:
        description: "GitOps engine"
        type: choice
        options:
          - argocd
          - flux
        default: argocd
  workflow_call:
    inputs:
      archetype:
        description: "Pipeline archetype"
        type: string
        required: true
      docker_options:
        description: "Docker build behavior"
        type: string
        default: build_and_push
      namespace_override:
        description: "Use app namespace without environment suffix"
        type: boolean
        default: false
      kustomization_overlay:
        description: "Use overlays folder"
        type: boolean
        default: false
      helm_chart:
        description: "Use Helm chart (unused for now)"
        type: boolean
        default: false
      gitops_app:
        description: "GitOps engine"
        type: string
        default: argocd
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      REGISTRY:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      ARGOCD_SERVER:
        required: false
      ARGOCD_TOKEN:
        required: false
      GITOPS_SSH_PRIVATE_KEY:
        required: false
      CLUSTER_PROD:
        required: false
      AZURE_CREDENTIALS:
        required: false
      SP_RG_DEVOPS_APP_ID:
        required: false
      SP_RG_DEVOPS_SECRET:
        required: false
      TENANT_ID:
        required: false

permissions:
  contents: write

concurrency:
  group: core-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  extract-info:
    name: Extract Build Info
    runs-on: ubuntu-latest
    outputs:
      org_name: ${{ steps.extract.outputs.org_name }}
      app_name: ${{ steps.extract.outputs.app_name }}
      repo_tag: ${{ steps.extract.outputs.repo_tag }}
      app_project: ${{ steps.extract.outputs.app_project }}
      environment: ${{ steps.extract.outputs.environment }}
      repo_url: ${{ steps.extract.outputs.repo_url }}
      cluster_url: ${{ steps.extract.outputs.cluster_url }}
      argocd_project_namespace: ${{ steps.extract.outputs.argocd_project_namespace }}
      namespace: ${{ steps.extract.outputs.namespace }}
      tag_exists: ${{ steps.extract.outputs.tag_exists }}
      kustomization_path: ${{ steps.extract.outputs.kustomization_path }}
      resource_group: ${{ steps.extract.outputs.resource_group }}
      cluster_name: ${{ steps.extract.outputs.cluster_name }}
      commit_id: ${{ steps.extract.outputs.commit_id }}
      last_tag_prefix: ${{ steps.extract.outputs.last_tag_prefix }}
      last_tag: ${{ steps.extract.outputs.last_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract build info
        id: extract
        uses: ./.github/actions/extract-info
        with:
          namespace_override: ${{ inputs.namespace_override }}
          kustomization_overlay: ${{ inputs.kustomization_overlay }}
          cluster_prod: ${{ secrets.CLUSTER_PROD }}

  build-containers:
    name: Build Containers
    runs-on: ubuntu-latest
    needs: extract-info
    if: >-
      ${{
        inputs.archetype == 'containers'
        && inputs.docker_options != 'disable_docker'
        && inputs.docker_options != 'disable'
      }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build containers
        uses: ./.github/actions/build-containers
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          docker_options: ${{ inputs.docker_options }}

  tag:
    name: Git Tag
    runs-on: ubuntu-latest
    needs: [extract-info, build-containers]
    if: >-
      ${{
        needs.extract-info.result == 'success'
        && (needs.build-containers.result == 'success' || needs.build-containers.result == 'skipped')
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag repository
        uses: ./.github/actions/git-tag
        with:
          repo_tag: ${{ needs.extract-info.outputs.repo_tag }}
          tag_exists: ${{ needs.extract-info.outputs.tag_exists }}

  deploy-argocd:
    name: Deploy via Argo CD
    runs-on: ubuntu-latest
    needs: [extract-info, tag]
    if: >-
      ${{
        inputs.gitops_app == 'argocd'
        && needs.extract-info.result == 'success'
        && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy with Argo CD
        uses: ./.github/actions/deploy-argocd
        with:
          argocd_server: ${{ secrets.ARGOCD_SERVER }}
          argocd_token: ${{ secrets.ARGOCD_TOKEN }}
          gitops_ssh_private_key: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}
          repo_url: ${{ needs.extract-info.outputs.repo_url }}
          app_name: ${{ needs.extract-info.outputs.app_name }}
          app_project: ${{ needs.extract-info.outputs.app_project }}
          cluster_url: ${{ needs.extract-info.outputs.cluster_url }}
          argocd_project_namespace: ${{ needs.extract-info.outputs.argocd_project_namespace }}
          environment: ${{ needs.extract-info.outputs.environment }}
          kustomization_path: ${{ needs.extract-info.outputs.kustomization_path }}
          namespace: ${{ needs.extract-info.outputs.namespace }}
          repo_tag: ${{ needs.extract-info.outputs.repo_tag }}

  deploy-flux:
    name: Deploy via Flux
    runs-on: ubuntu-latest
    needs: [extract-info, tag]
    if: >-
      ${{
        inputs.gitops_app == 'flux'
        && needs.extract-info.result == 'success'
        && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy with Flux
        uses: ./.github/actions/deploy-flux
        with:
          azure_credentials: ${{ secrets.AZURE_CREDENTIALS }}
          sp_app_id: ${{ secrets.SP_RG_DEVOPS_APP_ID }}
          sp_app_secret: ${{ secrets.SP_RG_DEVOPS_SECRET }}
          tenant_id: ${{ secrets.TENANT_ID }}
          gitops_ssh_private_key: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}
          resource_group: ${{ needs.extract-info.outputs.resource_group }}
          cluster_name: ${{ needs.extract-info.outputs.cluster_name }}
          app_project: ${{ needs.extract-info.outputs.app_project }}
          namespace: ${{ needs.extract-info.outputs.namespace }}
          repo_url: ${{ needs.extract-info.outputs.repo_url }}
          repo_tag: ${{ needs.extract-info.outputs.repo_tag }}
          kustomization_path: ${{ needs.extract-info.outputs.kustomization_path }}
