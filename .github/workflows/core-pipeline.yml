name: Core Pipeline

on:
  workflow_dispatch:
    inputs:
      pipeline_mode:
        type: choice
        options: [build_and_push, build_only, deploy_only]
        default: build_and_push
      namespace_override:
        type: boolean
        default: false
      kustomization_overlay:
        type: boolean
        default: false
      archetype:
        type: choice
        options: [containers, k8s-apps]
        default: containers
      gitops_app:
        type: choice
        options: [argocd]
        default: argocd
      argocd_deployment_mode:
        type: choice
        options: [kustomize, application]
        default: kustomize
      argocd_application_manifest:
        type: string
        default: ""

  workflow_call:
    inputs:
      pipeline_mode: { type: string, default: build_and_push }
      namespace_override: { type: boolean, default: false }
      kustomization_overlay: { type: boolean, default: false }
      archetype: { type: string, required: true }
      gitops_app: { type: string, default: argocd }
      argocd_deployment_mode: { type: string, default: kustomize }
      argocd_application_manifest: { type: string, default: "" }
    secrets:
      DOCKERHUB_USERNAME: { required: false }
      DOCKERHUB_TOKEN: { required: false }
      REGISTRY: { required: false }
      REGISTRY_USERNAME: { required: false }
      REGISTRY_PASSWORD: { required: false }
      ARGOCD_SERVER: { required: false }
      ARGOCD_TOKEN: { required: false }
      GITOPS_SSH_PRIVATE_KEY: { required: false }
      CLUSTER_DEVELOP: { required: false }
      CLUSTER_PRODUCTION: { required: false }

permissions:
  contents: write

concurrency:
  group: core-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Extract build info
        id: info
        uses: glauciolabs/core-pipeline/.github/actions/extract-info@add2
        with:
          namespace_override: ${{ inputs.namespace_override }}
          kustomization_overlay: ${{ inputs.kustomization_overlay }}
          cluster_develop: ${{ secrets.CLUSTER_DEVELOP }}
          cluster_production: ${{ secrets.CLUSTER_PRODUCTION }}

      - name: Build containers
        if: ${{ inputs.pipeline_mode != 'deploy_only' && inputs.archetype == 'containers' }}
        uses: glauciolabs/core-pipeline/.github/actions/build-containers@add2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          docker_options: ${{ inputs.pipeline_mode }}

      - name: Git tag
        # tag para build_and_push e deploy_only
        if: ${{ inputs.pipeline_mode != 'build_only' }}
        uses: glauciolabs/core-pipeline/.github/actions/git-tag@add2
        with:
          repo_tag: ${{ steps.info.outputs.repo_tag }}
          tag_exists: ${{ steps.info.outputs.tag_exists }}

      - name: Deploy with Argo CD
        if: ${{ inputs.pipeline_mode != 'build_only' && inputs.gitops_app == 'argocd' }}
        uses: glauciolabs/core-pipeline/.github/actions/deploy-argocd@add2
        with:
          argocd_server: ${{ secrets.ARGOCD_SERVER }}
          argocd_token: ${{ secrets.ARGOCD_TOKEN }}
          gitops_ssh_private_key: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}
          repo_url: ${{ steps.info.outputs.repo_url }}
          app_name: ${{ steps.info.outputs.app_name }}
          app_project: ${{ steps.info.outputs.app_project }}
          cluster_url: ${{ steps.info.outputs.cluster_url }}
          argocd_project_namespace: ${{ steps.info.outputs.argocd_project_namespace }}
          environment: ${{ steps.info.outputs.environment }}
          kustomization_path: ${{ steps.info.outputs.kustomization_path }}
          namespace: ${{ steps.info.outputs.namespace }}
          repo_tag: ${{ steps.info.outputs.repo_tag }}
          deployment_mode: ${{ inputs.argocd_deployment_mode }}
          application_manifest_path: ${{ inputs.argocd_application_manifest }}
